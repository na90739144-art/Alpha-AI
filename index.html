<!DOCTYPE html>
<html lang="fa" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0e0e0e">
<meta name="description" content="هوش مصنوعی Alpha - چت هوش مصنوعی، ترجمه متن، ترجمه PDF و دستیار صوتی">
<title>هوش مصنوعی Alpha</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
:root{
 --gold:#d4af37; --gold-light:#f4e5a1; --bg:#0e0e0e; --bg2:#1a1a1a; --bg3:#232323;
 --glass:rgba(255,255,255,.04); --glass-brd:rgba(212,175,55,.25); --txt:#f2f2f2; --muted:#9a9a9a; --danger:#e5484d; --ok:#3ecf8e;
 --radius:14px; --shadow:0 8px 30px rgba(0,0,0,.45);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Vazirmatn","Segoe UI",Tahoma,sans-serif;background:radial-gradient(1200px 800px at 80% -10%,#20200f 0%,var(--bg) 55%),var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;outline:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;color:var(--txt);outline:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:var(--gold)}
.hidden{display:none !important}
.glass{background:var(--glass);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border:1px solid var(--glass-brd);border-radius:var(--radius)}

/* ---------- AUTH ---------- */
#authScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{width:100%;max-width:420px;padding:36px 28px;text-align:center;animation:fadeUp .5s ease}
.vpn-notice{background:rgba(212,175,55,.12);border:1px solid var(--gold);color:var(--gold);font-size:12.5px;font-weight:700;border-radius:10px;padding:10px 12px;margin-bottom:20px}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.brand-logo{width:64px;height:64px;border-radius:14px;margin:0 auto 16px;overflow:hidden;background:#101010}
.brand-logo img{width:100%;height:100%;object-fit:cover}
.brand-title{font-size:19px;font-weight:600;color:var(--txt);letter-spacing:.2px}
.brand-sub{font-size:11px;color:var(--muted);margin-top:4px;margin-bottom:28px;letter-spacing:.5px;text-transform:uppercase}
.tabbar{display:flex;background:var(--bg3);border-radius:10px;padding:4px;margin-bottom:20px}
.tabbar button{flex:1;padding:9px;border-radius:8px;font-size:13px;color:var(--muted);font-weight:600;transition:.2s}
.tabbar button.active{background:var(--gold);color:#101010}
.field{text-align:right;margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.field input{width:100%;padding:12px 14px;background:var(--bg3);border:1px solid #333;border-radius:10px;font-size:14px}
.field input:focus{border-color:var(--gold)}
.btn-primary{width:100%;padding:13px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold-light));color:#101010;font-weight:800;font-size:14px;margin-top:6px;transition:.2s}
.btn-primary:hover{filter:brightness(1.08)}
.btn-google{width:100%;padding:12px;border-radius:10px;background:#fff;color:#1a1a1a;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px}
.divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--muted);font-size:11px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:#333}
.auth-note{font-size:11px;color:var(--muted);margin-top:16px;line-height:1.8}
.auth-tabs{display:flex;gap:10px;margin-bottom:20px}
.auth-tab{flex:1;padding:15px 8px;border-radius:12px;background:transparent;color:var(--gold);font-size:14px;font-weight:700;border:1.5px solid #3a3a3a}
.auth-tab.active{background:var(--gold);color:#101010;font-weight:800;border-color:var(--gold)}

/* ---------- APP SHELL ---------- */
#appShell{display:flex;height:100vh}
.sidebar{width:270px;flex-shrink:0;background:linear-gradient(180deg,#141414,#1c1c1c);border-inline-start:2px solid var(--gold);display:flex;flex-direction:column;padding:18px;overflow-y:auto}
.sb-logo{display:flex;align-items:center;gap:10px;padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid #2a2a2a}
.sb-logo .ic{width:42px;height:42px;border-radius:10px;overflow:hidden;background:#101010}
.sb-logo .ic img{width:100%;height:100%;object-fit:cover}
.sb-logo h1{font-size:16px;color:var(--gold);font-weight:800}
.sb-logo p{font-size:10px;color:var(--muted)}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;font-size:13px;color:#ccc;margin-bottom:4px;transition:.2s;text-align:right;width:100%}
.nav-item:hover{background:var(--bg3)}
.nav-item.active{background:var(--gold);color:#101010;font-weight:700}
.sb-section-title{font-size:11px;color:var(--gold);text-transform:uppercase;font-weight:700;margin:16px 0 8px}
.sb-history{flex:1;overflow-y:auto}
.sb-hist-item{padding:9px 10px;background:var(--bg3);border-radius:8px;font-size:11.5px;color:#aaa;margin-bottom:6px;cursor:pointer;border-inline-start:2px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-hist-item:hover{border-inline-start-color:var(--gold);color:var(--gold)}
.sb-user{display:flex;align-items:center;gap:8px;padding:10px;background:var(--bg3);border-radius:10px;margin-top:12px;cursor:pointer}
.sb-user .av{width:32px;height:32px;border-radius:50%;background:var(--gold);color:#101010;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px}
.sb-user .info{flex:1;overflow:hidden}
.sb-user .info b{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-user .info span{font-size:10px;color:var(--muted)}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{padding:16px 26px;border-bottom:2px solid var(--gold);display:flex;align-items:center;justify-content:space-between;background:linear-gradient(90deg,#141414,#1c1c1c)}
.topbar h2{font-size:19px;color:var(--gold);font-weight:800}
.topbar p{font-size:11px;color:var(--muted)}
.menu-toggle{display:flex}
.view{flex:1;overflow-y:auto;padding:16px 18px}
.banner-warn{background:rgba(229,72,77,.12);border:1px solid var(--danger);color:#ff9a9d;font-size:12px;padding:10px 14px;border-radius:10px;margin-bottom:16px;line-height:1.9}

/* ---------- HOME ---------- */
.home-hi{font-size:19px;font-weight:800;margin-bottom:3px}
.home-sub{color:var(--muted);font-size:12px;margin-bottom:14px}
.quick-chips{display:flex;gap:9px;overflow-x:auto;padding-bottom:2px;margin-bottom:14px;scrollbar-width:none}
.quick-chips::-webkit-scrollbar{display:none}
.chip-pill{flex-shrink:0;padding:9px 18px;border-radius:24px;background:var(--bg3);border:1px solid var(--glass-brd);color:var(--gold);font-size:12.5px;font-weight:600;white-space:nowrap;transition:.2s}
.chip-pill:hover{background:var(--bg2);border-color:var(--gold)}
.quick-bar{border-radius:22px;padding:14px 16px 12px;margin-bottom:24px}
.quick-bar input{width:100%;background:transparent;font-size:14.5px;padding:4px 2px 12px;margin-bottom:10px;border-bottom:1px solid #2a2a2a}
.quick-bar-controls{display:flex;align-items:center;gap:8px}
.quick-mode-select{background:var(--bg3);border:1px solid #333;border-radius:20px;padding:7px 12px;font-size:11.5px;color:#ccc;max-width:128px}
.quick-send{background:var(--gold);color:#101010}
.quick-send:hover{background:var(--gold-light)}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:26px}
.card{padding:20px 16px;text-align:center;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-3px);border-color:var(--gold)}
.card .ic{font-size:28px;margin-bottom:10px}
.card b{font-size:13.5px;display:block}
.card span{font-size:10.5px;color:var(--muted)}


/* ---------- AI TOOLS ---------- */
.tools-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;align-content:start}
@media(max-width:900px){.tools-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tool-card{padding:9px 8px;text-align:right;cursor:pointer;transition:.2s;min-height:60px;background:linear-gradient(160deg,rgba(212,175,55,.07),rgba(212,175,55,.01));border:1px solid rgba(212,175,55,.35);border-radius:11px}
.tool-card:hover{transform:translateY(-2px);border-color:var(--gold)}
.tool-card b{font-size:10.5px;display:block;margin-bottom:2px;line-height:1.4}
.tool-card span{font-size:8.5px;color:var(--muted);line-height:1.4;display:block}
@media(max-width:700px){.view{padding:12px}.home-grid-2col{gap:7px}.home-big-card{padding:10px}.home-big-card .ic{width:28px;height:28px;margin-bottom:5px}.home-big-card b{font-size:11px}.home-big-card span{font-size:9px}.tools-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.tool-card{padding:9px 8px;min-height:58px}}

/* ---------- CHAT ---------- */
.chat-wrap{display:flex;flex-direction:column;height:100%}
.mode-select{margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:20px;font-size:11.5px;background:var(--bg3);color:#bbb;border:1px solid #333}
.chip.active{background:var(--gold);color:#101010;border-color:var(--gold);font-weight:700}
.chat-area{flex:1;overflow-y:auto;padding:6px 4px 16px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:78%;padding:13px 16px;border-radius:14px;font-size:14px;line-height:1.9;position:relative}
.msg.user{align-self:flex-start;background:linear-gradient(135deg,var(--gold),var(--gold-light));color:#101010;font-weight:600;border-bottom-left-radius:4px}
.msg.ai{align-self:flex-end;background:var(--bg3);border:1px solid #2c2c2c;border-bottom-right-radius:4px;white-space:pre-wrap}
.msg-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.msg-actions button{font-size:10.5px;color:var(--muted);background:var(--bg2);padding:4px 9px;border-radius:6px}
.msg-actions button:hover{color:var(--gold)}
.typing{align-self:flex-end;color:var(--muted);font-size:12px;padding:8px 4px}
.input-bar{display:flex;align-items:center;gap:5px;padding:8px;border-radius:14px;background:var(--bg3);border:1px solid #2c2c2c;margin-top:10px}
.input-bar .send-btn{margin-inline-start:auto;padding:9px 14px;font-size:12px;flex-shrink:0}
.input-bar input{flex:1;min-width:0;background:transparent;padding:8px 4px;font-size:13px}
.icon-btn{width:38px;height:38px;border-radius:10px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.icon-btn:hover{background:#2c2c2c}
.icon-btn.rec,.rec{background:var(--danger);color:#fff}
.send-btn{padding:10px 18px;border-radius:10px;background:var(--gold);color:#101010;font-weight:800;font-size:13px}
.attach-pill{padding:8px 9px;border-radius:9px;background:transparent;border:1px solid #3a3a3a;color:var(--gold);font-size:11px;font-weight:700;flex-shrink:0;white-space:nowrap;display:flex;align-items:center;gap:4px}
.attach-pill:active{background:rgba(212,175,55,.1)}
.top-menu{position:absolute;top:46px;inset-inline-start:0;background:linear-gradient(180deg,#161616,#1e1e1e);border:1px solid var(--gold);border-radius:12px;padding:6px;min-width:150px;z-index:60;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px}
.top-menu button,.top-menu a{padding:11px 14px;border-radius:8px;text-align:right;font-size:13px;color:var(--txt);text-decoration:none;display:block;width:100%}
.top-menu button:active,.top-menu a:active{background:rgba(212,175,55,.12)}
.top-menu button.danger{color:var(--danger)}
.quick-actions-row{display:flex;gap:8px;margin-bottom:16px}
.quick-actions-row .qa-btn{flex:1;padding:11px 4px;border-radius:10px;background:var(--bg3);border:1px solid #333;color:var(--gold);font-size:12px;font-weight:700;text-align:center}
.quick-actions-row .qa-btn.danger{color:var(--danger);border-color:rgba(255,90,90,.35)}
.assist-list{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.assist-row{display:flex;flex-direction:column;align-items:flex-end;gap:10px;padding:18px 16px;cursor:pointer;transition:.2s;text-align:right;background:linear-gradient(160deg,rgba(212,175,55,.07),rgba(212,175,55,.01));border:1px solid rgba(212,175,55,.4);border-radius:18px}
.assist-row:active{transform:scale(.98);border-color:var(--gold)}
.assist-row .ic{width:40px;height:40px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:11px;background:rgba(212,175,55,.15);color:var(--gold);box-shadow:0 0 14px rgba(212,175,55,.25)}
.assist-row .txt{width:100%}
.assist-row b{font-size:13px;display:block;margin-bottom:3px;color:var(--txt)}
.assist-row span{font-size:10.5px;color:var(--muted);line-height:1.6;display:block}
.home-grid-2col{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.home-big-card{padding:13px 12px;cursor:pointer;transition:.2s;text-align:right;background:linear-gradient(160deg,rgba(212,175,55,.07),rgba(212,175,55,.01));border:1px solid rgba(212,175,55,.4);border-radius:14px;position:relative}
.home-big-card:active{transform:scale(.98);border-color:var(--gold)}
.home-big-card.full-width{grid-column:1 / -1}
.home-big-card.disabled{cursor:default;opacity:.55}
.home-big-card.disabled:active{transform:none;border-color:rgba(212,175,55,.4)}
.home-big-card .ic{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:rgba(212,175,55,.15);color:var(--gold);margin-bottom:8px;box-shadow:0 0 14px rgba(212,175,55,.3)}
.home-big-card b{font-size:12.5px;display:block;margin-bottom:2px;color:var(--txt)}
.home-big-card span{font-size:10px;color:var(--muted);line-height:1.5;display:block}
.soon-badge{position:absolute;top:10px;left:10px;background:rgba(212,175,55,.15);color:var(--gold);font-size:9px;font-weight:700;padding:3px 8px;border-radius:20px;border:1px solid rgba(212,175,55,.35)}

/* ---------- TRANSLATE ---------- */
.lang-row{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.lang-row select{flex:1;padding:11px;background:var(--bg3);border:1px solid #333;border-radius:10px;font-size:13px}
.swap-btn{width:38px;height:38px;border-radius:10px;background:var(--bg3);flex-shrink:0}
textarea.ta{width:100%;min-height:130px;padding:14px;background:var(--bg3);border:1px solid #2c2c2c;border-radius:12px;font-size:14px;resize:vertical;line-height:1.8;margin-bottom:14px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.btn-gold{padding:11px 20px;border-radius:10px;background:var(--gold);color:#101010;font-weight:800;font-size:13px}
.btn-ghost{padding:11px 18px;border-radius:10px;background:var(--bg3);border:1px solid #333;font-size:13px;color:#ccc}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}

/* ---------- PDF ---------- */
.dropzone{border:2px dashed #3a3a3a;border-radius:14px;padding:38px 16px;text-align:center;cursor:pointer;margin-bottom:16px;transition:.2s}
.dropzone:hover{border-color:var(--gold)}
.dropzone .ic{font-size:34px;margin-bottom:10px}
.progress-wrap{background:var(--bg3);border-radius:20px;height:10px;overflow:hidden;margin:14px 0}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-light));width:0%;transition:width .3s}
.opt-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#ccc;margin-bottom:8px}

/* ---------- VOICE ---------- */
.voice-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center}
.mic-btn{width:110px;height:110px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-light));display:flex;align-items:center;justify-content:center;font-size:44px;box-shadow:0 0 0 0 rgba(212,175,55,.5);margin-bottom:20px}
.mic-btn.listening{animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(212,175,55,.55)}70%{box-shadow:0 0 0 26px rgba(212,175,55,0)}100%{box-shadow:0 0 0 0 rgba(212,175,55,0)}}
.voice-transcript{max-width:520px;margin-top:20px;color:#ccc;font-size:14px;line-height:1.9}
.voice-answer{max-width:520px;margin-top:14px;padding:16px;font-size:14px;line-height:1.9}

/* ---------- HISTORY ---------- */
.hist-search{width:100%;padding:11px 14px;background:var(--bg3);border:1px solid #333;border-radius:10px;margin-bottom:16px;font-size:13px}
.hist-row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;margin-bottom:8px}
.hist-row .l{display:flex;align-items:center;gap:10px}
.hist-row .l b{font-size:13px;display:block;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-row .l span{font-size:10.5px;color:var(--muted)}
.hist-actions button{font-size:11px;color:var(--muted);padding:5px 8px}
.hist-actions button:hover{color:var(--gold)}

/* ---------- PROFILE / SETTINGS ---------- */
.profile-card{padding:26px;text-align:center;max-width:420px;margin:0 auto 20px}
.profile-av{width:80px;height:80px;border-radius:50%;background:var(--gold);color:#101010;font-weight:800;font-size:28px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.stat-row{display:flex;gap:14px;justify-content:center;margin-top:18px}
.stat{padding:12px 18px;background:var(--bg3);border-radius:10px}
.stat b{display:block;font-size:18px;color:var(--gold)}
.stat span{font-size:10.5px;color:var(--muted)}
.settings-group{max-width:520px;margin:0 auto 18px;padding:6px 0}
.settings-group h4{font-size:12px;color:var(--gold);text-transform:uppercase;margin-bottom:10px}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;margin-bottom:8px}
.setting-row span{font-size:13px}
.switch{width:44px;height:24px;border-radius:20px;background:#333;position:relative;flex-shrink:0}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--gold)}
.switch.on::after{inset-inline-start:23px}
.seg{display:flex;background:var(--bg3);border-radius:10px;padding:3px}
.seg button{padding:6px 14px;font-size:11.5px;border-radius:8px;color:var(--muted)}
.seg button.active{background:var(--gold);color:#101010;font-weight:700}
.danger-btn{color:var(--danger)}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{max-width:400px;width:100%;padding:24px;text-align:center}
.modal h3{color:var(--gold);margin-bottom:10px;font-size:16px}
.modal p{font-size:13px;color:#ccc;line-height:1.9;margin-bottom:18px}

@media (max-width:860px){
 .sidebar{position:fixed;inset-inline-start:0;top:0;bottom:0;z-index:50;transform:translateX(110%);transition:.25s;box-shadow:var(--shadow)}
 html[dir="rtl"] .sidebar{transform:translateX(110%)}
 html[dir="ltr"] .sidebar{transform:translateX(-110%)}
 .sidebar.open{transform:translateX(0)}
 .menu-toggle{display:flex}
 .msg{max-width:90%}
}
</style>
</head>
<body>

<!-- ================= AUTH SCREEN ================= -->
<div id="authScreen">
 <div class="auth-card glass">
 <div class="vpn-notice" data-i18n="vpnNotice">لطفاً VPN را روشن کنید</div>
 <div class="brand-logo"><img src="icon-192.png" alt="Alpha"></div>
 <div class="brand-title" data-i18n="brandTitle">هوش مصنوعی Alpha</div>
 <div class="brand-sub">Alpha AI</div>

 <div class="auth-tabs">
 <button class="auth-tab active" id="tabLoginBtn" onclick="app.switchAuthTab('login')" data-i18n="tabLogin">ورود</button>
 <button class="auth-tab" id="tabRegisterBtn" onclick="app.switchAuthTab('register')" data-i18n="tabRegister">ثبت‌نام</button>
 </div>

 <div id="formLogin">
 <div class="field"><label data-i18n="lblEmail">ایمیل</label><input type="email" id="loginEmail" placeholder="example@gmail.com"></div>
 <div class="field"><label data-i18n="lblPass">رمز عبور</label><input type="password" id="loginPass" placeholder="••••••••"></div>
 <button class="btn-primary" onclick="app.login()" data-i18n="btnLoginSubmit">ورود</button>
