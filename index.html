<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="description" content="ALPHA - هوش مصنوعی حرفه‌ای | ترجمه و چت">
    <title>ALPHA - هوش مصنوعی پیشرفته</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%23d4af37' width='192' height='192'/><rect fill='%231a1a1a' width='192' height='192'/><text x='96' y='130' font-size='100' fill='%23d4af37' text-anchor='middle' font-weight='bold'>A</text></svg>">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', 'Trebuchet MS', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }
        
        .container {
            display: flex;
            height: 100vh;
        }
        
        /* Sidebar */
        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #1a1a1a 0%, #242424 100%);
            border-left: 2px solid #d4af37;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #d4af37;
        }
        
        .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #d4af37 0%, #f0e68c 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: #1a1a1a;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        
        .logo-text h1 {
            font-size: 24px;
            color: #d4af37;
            font-weight: bold;
        }
        
        .logo-text p {
            font-size: 11px;
            color: #999;
            margin-top: 2px;
        }
        
        .lang-section {
            margin-bottom: 25px;
        }
        
        .lang-section label {
            display: block;
            font-size: 12px;
            color: #d4af37;
            margin-bottom: 10px;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .lang-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        
        .lang-btn {
            padding: 10px;
            background: #2d2d2d;
            border: 1px solid #404040;
            border-radius: 6px;
            color: #ccc;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }
        
        .lang-btn:hover {
            background: #3d3d3d;
            border-color: #d4af37;
            color: #d4af37;
        }
        
        .lang-btn.active {
            background: #d4af37;
            color: #1a1a1a;
            border-color: #d4af37;
            font-weight: bold;
        }
        
        .history-section {
            flex: 1;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #404040;
        }
        
        .history-title {
            font-size: 12px;
            color: #d4af37;
            margin-bottom: 15px;
            text-transform: uppercase;
            font-weight: bold;
        }
        
        .history-item {
            padding: 10px;
            background: #2d2d2d;
            border-radius: 6px;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.3s;
            border-left: 2px solid transparent;
        }
        
        .history-item:hover {
            background: #353535;
            color: #d4af37;
            border-left-color: #d4af37;
        }
        
        /* Main Content */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1a1a1a;
        }
        
        .header {
            background: linear-gradient(90deg, #1a1a1a 0%, #2d2d2d 100%);
            padding: 20px 30px;
            border-bottom: 2px solid #d4af37;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
        }
        
        .header-title {
            font-size: 28px;
            font-weight: bold;
            color: #d4af37;
            letter-spacing: 2px;
        }
        
        .header-subtitle {
            font-size: 12px;
            color: #999;
            margin-top: 2px;
        }
        
        .mode-toggle {
            display: flex;
            gap: 10px;
        }
        
        .mode-btn {
            padding: 8px 15px;
            background: #2d2d2d;
            border: 1px solid #d4af37;
            color: #d4af37;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
            font-weight: bold;
        }
        
        .mode-btn.active {
            background: #d4af37;
            color: #1a1a1a;
        }
        
        .content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        
        /* Chat Area */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .message {
            padding: 16px 20px;
            border-radius: 10px;
            max-width: 80%;
            word-wrap: break-word;
            animation: slideIn 0.4s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .user-message {
            align-self: flex-start;
            background: linear-gradient(135deg, #2d2d2d 0%, #3d3d3d 100%);
            border-left: 4px solid #d4af37;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.15);
        }
        
        .ai-message {
            align-self: flex-end;
            background: linear-gradient(135deg, #d4af37 0%, #f0e68c 100%);
            color: #1a1a1a;
            border-right: 4px solid #f0e68c;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        
        .message-text {
            margin-bottom: 10px;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .message-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        
        .action-btn {
            padding: 6px 12px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid currentColor;
            border-radius: 4px;
            color: inherit;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.3s;
        }
        
        .ai-message .action-btn {
            color: #1a1a1a;
        }
        
        .action-btn:hover {
            background: rgba(0, 0, 0, 0.3);
            transform: scale(1.05);
        }
        
        .loading {
            align-self: flex-end;
            color: #999;
            font-size: 13px;
            font-style: italic;
        }
        
        .input-area {
            background: #2d2d2d;
            padding: 20px 30px;
            border-top: 2px solid #d4af37;
            display: flex;
            gap: 12px;
            align-items: flex-end;
            box-shadow: inset 0 2px 10px rgba(212, 175, 55, 0.1);
        }
        
        .input-wrapper {
            flex: 1;
            display: flex;
            gap: 8px;
        }
        
        .input-area input {
            flex: 1;
            padding: 12px 16px;
            background: #1a1a1a;
            border: 1px solid #404040;
            border-radius: 6px;
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .input-area input:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }
        
        .input-area input::placeholder {
            color: #666;
        }
        
        .input-area button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #d4af37 0%, #f0e68c 100%);
            border: none;
            border-radius: 6px;
            color: #1a1a1a;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        
        .input-area button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
        }
        
        .input-area button:active {
            transform: translateY(0);
        }
        
        /* Translation Panel */
        .translation-panel {
            width: 350px;
            background: linear-gradient(180deg, #1a1a1a 0%, #242424 100%);
            border-left: 2px solid #d4af37;
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            box-shadow: inset 2px 0 15px rgba(0, 0, 0, 0.3);
        }
        
        .panel-title {
            font-size: 16px;
            color: #d4af37;
            margin-bottom: 20px;
            font-weight: bold;
            padding-bottom: 15px;
            border-bottom: 2px solid #d4af37;
        }
        
        .translate-input {
            width: 100%;
            padding: 12px;
            background: #2d2d2d;
            border: 1px solid #404040;
            border-radius: 6px;
            color: #fff;
            font-family: inherit;
            font-size: 13px;
            margin-bottom: 15px;
            resize: vertical;
            min-height: 100px;
        }
        
        .translate-input:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }
        
        .translate-output {
            width: 100%;
            padding: 12px;
            background: #2d2d2d;
            border: 1px solid #d4af37;
            border-radius: 6px;
            color: #d4af37;
            font-family: inherit;
            font-size: 13px;
            min-height: 100px;
            resize: vertical;
        }
        
        .translate-label {
            font-size: 12px;
            color: #d4af37;
            margin-bottom: 8px;
            font-weight: bold;
        }
        
        .translate-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #d4af37 0%, #f0e68c 100%);
            border: none;
            border-radius: 6px;
            color: #1a1a1a;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s;
        }
        
        .translate-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        
        .tts-btn {
            width: 100%;
            padding: 10px;
            background: #2d2d2d;
            border: 1px solid #d4af37;
            border-radius: 4px;
            color: #d4af37;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            font-size: 12px;
            transition: all 0.3s;
        }
        
        .tts-btn:hover {
            background: #d4af37;
            color: #1a1a1a;
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #d4af37;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #f0e68c;
        }
        
        /* Responsive */
        @media (max-width: 1200px) {
            .translation-panel {
                width: 300px;
            }
        }
        
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                border-left: none;
                border-bottom: 2px solid #d4af37;
                padding: 15px;
            }
            
            .translation-panel {
                width: 100%;
                border-left: none;
                border-top: 2px solid #d4af37;
                max-height: 300px;
            }
            
            .message {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo">
                <div class="logo-icon">A</div>
                <div class="logo-text">
                    <h1>ALPHA</h1>
                    <p>هوش مصنوعی پیشرفته</p>
                </div>
            </div>
            
            <div class="lang-section">
                <label>🌍 زبان</label>
                <div class="lang-grid" id="langGrid"></div>
            </div>
            
            <div class="history-section">
                <div class="history-title">📜 تاریخچه</div>
                <div id="historyList"></div>
            </div>
        </div>
        
        <!-- Main Content -->
        <div class="main">
            <!-- Header -->
            <div class="header">
                <div>
                    <div class="header-title">ALPHA</div>
                    <div class="header-subtitle">هوش مصنوعی نیاز‌سنج | ترجمه و چت</div>
                </div>
                <div class="mode-toggle">
                    <button class="mode-btn active" onclick="switchMode('chat')">💬 چت</button>
                    <button class="mode-btn" onclick="switchMode('translate')">🌐 ترجمه</button>
                </div>
            </div>
            
            <!-- Content Area -->
            <div class="content">
                <!-- Chat -->
                <div class="chat-container" id="chatMode" style="display: flex;">
                    <div class="chat-area" id="chatArea"></div>
                    <div class="input-area">
                        <div class="input-wrapper">
                            <input 
                                type="text" 
                                id="messageInput" 
                                placeholder="پیام خود را بنویسید..."
                                onkeypress="if(event.key==='Enter') sendMessage()"
                            >
                        </div>
                        <button onclick="sendMessage()">ارسال</button>
                    </div>
                </div>
                
                <!-- Translation Panel -->
                <div class="translation-panel" id="translateMode" style="display: none;">
                    <div class="panel-title">🌐 ترجمه متن</div>
                    
                    <div class="translate-label">متن اصلی:</div>
                    <textarea class="translate-input" id="sourceText" placeholder="متن را وارد کنید..."></textarea>
                    
                    <div class="translate-label">متن ترجمه‌شده:</div>
                    <textarea class="translate-output" id="translatedText" readonly placeholder="نتیجه ترجمه اینجا نمایش داده می‌شود..."></textarea>
                    
                    <button class="translate-btn" onclick="translateText()">ترجمه کن</button>
                    <button class="tts-btn" onclick="speakTranslation()">🔊 بخوانید</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GROQ_API_KEY = "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";
        
        const LANGUAGES = {
            fa: { name: "🇮🇷 فارسی", code: "fa" },
            en: { name: "🇺🇸 English", code: "en" },
            ar: { name: "🇸🇦 العربية", code: "ar" },
            ur: { name: "🇵🇰 اردو", code: "ur" },
            tr: { name: "🇹🇷 Türkçe", code: "tr" },
            ku: { name: "🇮🇷 کوردی", code: "ku" },
            az: { name: "🇦🇿 Azərbaycanca", code: "az" },
            zh: { name: "🇨🇳 中文", code: "zh" }
        };
        
        let currentLanguage = "fa";
        let chatHistory = [];
        let translationHistory = [];
        
        // Initialize
        window.addEventListener("load", () => {
            initLanguages();
            addChatMessage("سلام! من ALPHA هستم. چطور می‌تونم کمکت کنم؟", false);
            if ("serviceWorker" in navigator) {
                navigator.serviceWorker.register("sw.js").catch(() => {});
            }
        });
        
        function initLanguages() {
            const grid = document.getElementById("langGrid");
            Object.entries(LANGUAGES).forEach(([code, lang]) => {
                const btn = document.createElement("button");
                btn.className = `lang-btn ${code === 'fa' ? 'active' : ''}`;
                btn.textContent = lang.name;
                btn.onclick = () => changeLanguage(code);
                grid.appendChild(btn);
            });
        }
        
        function changeLanguage(code) {
            currentLanguage = code;
            document.querySelectorAll(".lang-btn").forEach(btn => btn.classList.remove("active"));
            event.target.classList.add("active");
        }
        
        function switchMode(mode) {
            document.getElementById("chatMode").style.display = mode === "chat" ? "flex" : "none";
            document.getElementById("translateMode").style.display = mode === "translate" ? "flex" : "none";
            document.querySelectorAll(".mode-btn").forEach(btn => btn.classList.remove("active"));
            event.target.classList.add("active");
        }
        
        async function sendMessage() {
            const input = document.getElementById("messageInput");
            const text = input.value.trim();
            if (!text) return;
            
            input.value = "";
            addChatMessage(text, true);
            addChatMessage("فکر می‌کنم...", false);
            
            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${GROQ_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "mixtral-8x7b-32768",
                        messages: [{
                            role: "user",
                            content: `به زبان ${LANGUAGES[currentLanguage].name} جواب بده:\n\n${text}`
                        }],
                        max_tokens: 500
                    })
                });
                
                const data = await response.json();
                const answer = data.choices[0].message.content;
                
                const chatArea = document.getElementById("chatArea");
                chatArea.lastChild.remove();
                addChatMessage(answer, false);
            } catch (error) {
                const chatArea = document.getElementById("chatArea");
                chatArea.lastChild.remove();
                addChatMessage(`خطا: ${error.message}`, false);
            }
        }
        
        function addChatMessage(text, isUser) {
            const chatArea = document.getElementById("chatArea");
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${isUser ? "user-message" : "ai-message"}`;
            
            const textDiv = document.createElement("div");
            textDiv.className = "message-text";
            textDiv.textContent = text;
            msgDiv.appendChild(textDiv);
            
            if (!isUser) {
                const actions = document.createElement("div");
                actions.className = "message-actions";
                
                const copyBtn = document.createElement("button");
                copyBtn.className = "action-btn";
                copyBtn.textContent = "📋 کپی";
                copyBtn.onclick = () => navigator.clipboard.writeText(text);
                
                const speakBtn = document.createElement("button");
                speakBtn.className = "action-btn";
                speakBtn.textContent = "🔊 بخوانید";
                speakBtn.onclick = () => speak(text);
                
                actions.appendChild(copyBtn);
                actions.appendChild(speakBtn);
                msgDiv.appendChild(actions);
            }
            
            chatArea.appendChild(msgDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        
        async function translateText() {
            const source = document.getElementById("sourceText").value.trim();
            const output = document.getElementById("translatedText");
            
            if (!source) {
                output.value = "لطفاً متنی وارد کنید";
                return;
            }
            
            output.value = "درحال ترجمه...";
            
            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${GROQ_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "mixtral-8x7b-32768",
                        messages: [{
                            role: "user",
                            content: `این متن را به ${LANGUAGES[currentLanguage].name} ترجمه کن:\n\n${source}`
                        }],
                        max_tokens: 500
                    })
                });
                
                const data = await response.json();
                output.value = data.choices[0].message.content;
                translationHistory.push({ source, translation: output.value });
            } catch (error) {
                output.value = `خطا: ${error.message}`;
            }
        }
        
        function speakTranslation() {
            const text = document.getElementById("translatedText").value;
            if (!text || text.includes("درحال") || text.includes("خطا")) return;
            speak(text);
        }
        
        function speak(text) {
            if ("speechSynthesis" in window) {
                speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = LANGUAGES[currentLanguage].code;
                utterance.rate = 1;
                utterance.pitch = 1;
                speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
